<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to XYZ Bank</title>
    <link rel="stylesheet" href="/static/login.css">
</head>
<body>
    <h1>XYZ Bank</h1>
    
    <div class="login-card">
        <h2>Login</h2>
        <input type="text" id="login-owner" placeholder="Account Number">
        <input type="password" id="login-pin" placeholder="Password">
        <button onclick="login()">Login</button>
        <p id="login-result"></p>
        <p>Don't have an account? <a href="/register" class="no-underline">Create Account</a></p>
    </div>
    
    <script src="/static/login.js"></script>
</body>
</html>
