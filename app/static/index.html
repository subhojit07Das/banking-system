<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Banking System</title>
        <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <h1>Hello XYZ's Customer</h1>
    
    <div class="card">
        <h2>Deposit</h2>
        <input type="text" id="deposit-account-id" placeholder="Account ID">
        <input type="number" id="deposit-amount" placeholder="Amount"> 
        <button onclick="deposit()">Deposit</button>
        <p id="deposit-result"></p>
    </div>
    
    <div class="card">
        <h2>Withdraw</h2>
        <input type="text" id="withdraw-account-id" placeholder="Account ID">
        <input type="number" id="withdraw-amount" placeholder="Amount">
        <button onclick="withdraw()">Withdraw</button>
        <p id="withdraw-result"></p>
    </div>
    
    <div class="card">
        <h2>Transaction History</h2>
        <input type="text" id="history-account-id" placeholder="Account ID">
        <button onclick="getHistory()">Get History</button>
        <pre id="history-result"></pre>
    </div>
    
    <div class="card">
        <h2>Get Account</h2>
        <input type="text" id="get-account-id" placeholder="Account ID">
        <button onclick="getAccount()">Get Account</button>
        <p id="get-result"></p>
    </div>
    
    <div class="card">
        <h2>Transfer Money</h2>
        <input type="text" id="transfer-sender-id" placeholder="Sender ID">
        <input type="text" id="transfer-receiver-id" placeholder="Receiver ID">
        <input type="number" id="transfer-amount" placeholder="Amount">
        <button onclick="transfer()">Transfer</button>
        <p id="transfer-result"></p>
    </div>
    
    <div class="card">
        <h2>Close Account</h2>
        <input type="text" id="close-account-id" placeholder="Account ID">
        <button onclick="closeAccount()">Close Account</button>
        <p id="close-result"></p>
    </div>
    
    <button onclick="localStorage.removeItem('token'); location.href='/login'">Exit</button>
    
    <script src="/static/app.js"></script>
</body>
</html>
