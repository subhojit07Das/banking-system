<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banking System</title>
    <link rel="stylesheet" href="http://localhost:8000/static/style.css">
</head>
<body>
    <h1>Banking System</h1>

    <div class="card">
        <h2>Create Account</h2>
        <input type="text" id="owner" placeholder="Your Name">
        <input type="number" id="balance" placeholder="Initial Balance">
        <input type="password" id="pin" placeholder="Password">
        <button onclick="createAccount()">Create Account</button>
        <p id="create-result"></p>
    </div>

    <div class="card">
        <h2>Deposit</h2>
        <input type="text" id="deposit-account-id" placeholder="Account ID">
        <input type="number" id="deposit-amount" placeholder="Amount">
        <input type="password" id="deposit-pin" placeholder="Password">    
        <button onclick="deposit()">Deposit</button>
        <p id="deposit-result"></p>
    </div>

    <div class="card">
        <h2>Withdraw</h2>
        <input type="text" id="withdraw-account-id" placeholder="Account ID">
        <input type="number" id="withdraw-amount" placeholder="Amount">
        <input type="password" id="withdraw-pin" placeholder="Password">
        <button onclick="withdraw()">Withdraw</button>
        <p id="withdraw-result"></p>
    </div>
        
    <div class="card">
        <h2>Transaction History</h2>
        <input type="text" id="history-account-id" placeholder="Account ID">
        <input type="password" id="history-pin" placeholder="PIN">
        <button onclick="getHistory()">Get History</button>
        <pre id="history-result"></pre>
    </div>
        
    <div class="card">
        <h2>Get Account</h2>
        <input type="text" id="get-account-id" placeholder="Account ID">
        <input type="password" id="get-password" placeholder="Password">
        <button onclick="getAccount()">Get Account</button>
        <p id="get-result"></p>
    </div>

    <div class="card">
        <h2>Transfer Money</h2>
        <input type="text" id="transfer-sender-id" placeholder="Sender ID">
        <input type="text" id="transfer-receiver-id" placeholder="Receiver ID">
        <input type="number" id="transfer-amount" placeholder="Amount">
        <input type="password" id="transfer-password" placeholder="Sender's Password">
        <button onclick="transfer()">Transfer</button>
        <p id="transfer-result"></p>
    </div>

    <div class="card">
        <h2>Close Account</h2>
        <input type="text" id="close-account-id" placeholder="Account ID">
        <input type="password" id="close-password" placeholder="Password">
        <button onclick="closeAccount()">Close Account</button>
        <p id="close-result"></p>
    </div>

    <script src="http://localhost:8000/static/app.js"></script>
</body>
</html>
